name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE: ''
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          VITE_TRIBAL_HABITS_ENROL_URL: ${{ vars.TRIBAL_HABITS_ENROL_URL }}
          VITE_WORKSHOP_ENQUIRY_URL: ${{ vars.WORKSHOP_ENQUIRY_URL }}
          VITE_SCAMWATCH_SUBSCRIBE_URL: ${{ vars.SCAMWATCH_SUBSCRIBE_URL }}
          VITE_PRIMARY_DOMAIN: ${{ vars.PRIMARY_DOMAIN }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name=cybersecurity-champions-frontend --branch=main
